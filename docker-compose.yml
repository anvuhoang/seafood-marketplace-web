# The whole shop in containers: PostgreSQL, Redis, Elasticsearch, two API processes, the website and nginx in front of them.
#
#   cp .env.docker.example .env      # then set POSTGRES_PASSWORD and JWT_SECRET
#   docker compose up --build        # open http://localhost:8088
#   docker compose --profile tools run --rm seed     # optional: sample vendors, products and customers
#   docker compose --profile tools run --rm seed-demo # optional, after seed: a full-looking shop (docs/demo-data.md)
#
# More in docs/deployment.md.

name: haisan

x-api: &api
  build:
    context: ./backend
  image: haisan-api:local
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
      required: false
  environment:
    NODE_ENV: production
    PORT: "5000"
    DATABASE_URL: postgresql://${POSTGRES_USER:-haisan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-haisan}?schema=public
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters)}
    FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8088}
    # Shared by both API processes, so limits and the cache are one set, not one per process.
    REDIS_URL: redis://redis:6379
    # Product search. If Elasticsearch is down the shop searches in memory, so the API does not need it to start.
    ELASTICSEARCH_URL: http://elasticsearch:9200
    # nginx is the one proxy in front of the API: trust it, so request.ip is the visitor and not nginx.
    TRUST_PROXY: "1"
    # The website's server calls the API through nginx's internal port; those calls are not counted per IP address.
    RATE_LIMIT_TRUST_INTERNAL: "true"
    API_DOCS_ENABLED: "false"
    CHAT_PROVIDER: ${CHAT_PROVIDER:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
    PAYOS_API_KEY: ${PAYOS_API_KEY:-}
    PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
    CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
    CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
    CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haisan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-haisan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haisan} -d ${POSTGRES_DB:-haisan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Every key the API writes has an expiry, so under memory pressure Redis may drop the oldest of them.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Product search: typos, no accents needed, best match first, suggestions while typing. One node, small heap.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # One node, nowhere to move shards to: with a disk more than 90% full (a CI runner after the Docker builds, a small
      # server) Elasticsearch would refuse to create the product index at all and the shop would search in memory.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    mem_limit: 1g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Runs the database migrations once, then stops. The API processes wait for it.
  migrate:
    build:
      context: ./backend
    image: haisan-api:local
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haisan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-haisan}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Two copies of the API. Docker's DNS gives the name "api" the address of each; nginx spreads calls over them.
  # More copies: raise `replicas` (or `docker compose up -d --scale api=3`).
  api:
    <<: *api
    deploy:
      replicas: 2

  web:
    build:
      context: ./frontend
      args:
        # What the browser calls: the public address of nginx.
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8088}/api
    image: haisan-web:local
    restart: unless-stopped
    environment:
      # What the website's own server calls while rendering a page: nginx's internal port (81, not published),
      # by its name on the compose network.
      API_INTERNAL_URL: http://nginx:81/api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional: `docker compose --profile tools run --rm seed` fills the database with sample data.
  seed:
    profiles: ["tools"]
    image: haisan-api:local
    command: ["npx", "tsx", "prisma/seed.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haisan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-haisan}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Optional: a shop that looks real (300 products, 900 orders, reviews). Run the seed first. See docs/demo-data.md.
  seed-demo:
    profiles: ["tools"]
    image: haisan-api:local
    command: ["npx", "tsx", "prisma/seed-demo.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-haisan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-haisan}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
  redisdata:
  esdata:
