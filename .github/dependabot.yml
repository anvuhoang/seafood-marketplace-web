version: 2

# Weekly pull requests that keep dependencies up to date. Minor and patch updates of one folder come in a single
# pull request, so there is one to review, not twenty.
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
