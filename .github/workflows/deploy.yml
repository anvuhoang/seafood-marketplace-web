name: Deploy

# Puts the newest images on the server. It starts by itself when "Publish images" has finished for main (so a merge
# into main goes live), or by hand: Actions > Deploy > Run workflow (choose the branch main).
#
# The server only pulls: the images are built by "Publish images" (docker-publish.yml), which writes the public address
# of the shop into the website, so the repository variable PUBLIC_URL must be set before the first run.
#
# Needs, in Settings > Secrets and variables > Actions:
#   Variables: DEPLOY_HOST   the DNS name or IP of the server, for example haisan.eastasia.cloudapp.azure.com
#              DEPLOY_USER   the login on the server (azureuser)
#              PUBLIC_URL    https://<the same DNS name>
#   Secret:    DEPLOY_SSH_KEY  the whole content of the private key (.pem) of the server
# The settings of the shop itself (.env) live on the server and are never given to GitHub.

on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to the server
    # A failed build must not reach the server.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'azureuser' }}
    steps:
      - name: Check the settings
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "Set the repository variable DEPLOY_HOST." >&2; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then echo "Set the secret DEPLOY_SSH_KEY." >&2; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare the connection
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's key is learned on the first connection of each run. To pin it, put its line in a secret
          # and write it to ~/.ssh/known_hosts here instead.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Send the files that start the shop
        run: |
          tar czf - docker-compose.yml docker-compose.prod.yml deploy \
            | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/haisan && cd /opt/haisan && tar xzf -"

      - name: Let the server read the images
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      # Pulls the images, runs the migration, starts the shop, checks that it answers, and goes back to the previous
      # images if it does not.
      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/haisan && bash deploy/deploy.sh"

      - name: Check the shop from outside
        run: |
          curl -fsS --retry 5 --retry-delay 5 "https://$DEPLOY_HOST/api/health"
          curl -fsS -o /dev/null --retry 3 "https://$DEPLOY_HOST/"
