# The front door of the shop: one address that serves the website and spreads API calls over several API processes.
#
#   browser ──> nginx ─┬─ /api/*  ──> every address the name "api" has (the API replicas)
#                      └─ /*      ──> web (Next.js)
#
# nginx asks Docker's DNS (127.0.0.11) for "api" and "web" again every 5 seconds, so a container that was recreated by a
# deploy (and so got another IP) is found without restarting nginx. With a plain `upstream` block nginx would keep the
# addresses it saw when it started and answer 502 for every request after the first deploy. The name "api" has one
# address per replica; nginx takes them in turn and, if one does not answer, tries the next (GET and HEAD only: nginx
# never repeats a POST on its own, so an order cannot be placed twice by the balancer).
#
# To add an API process: raise `deploy.replicas` of `api` in docker-compose.yml. Nothing here changes.

resolver 127.0.0.11 valid=5s ipv6=off;

# A coarse shield in front of the API's own limits (which count per route and per person):
# 50 requests per second per address, with a burst of 100.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;
limit_req_status 429;

# Behind another proxy (Caddy, on a server) every request arrives from that proxy's Docker address. Trust the visitor's
# address from X-Forwarded-For when, and only when, the request comes from a private (Docker) network, so the per-address
# limits count visitors and not the proxy. A request from outside cannot use this: it does not come from a private address.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    # The biggest upload is a vendor's voice note (5 MB) and product photos go straight to Cloudinary.
    client_max_body_size 8m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # For the container health check of nginx itself.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The chatbot answers as a stream (server-sent events): nothing may be held back until the answer is complete.
    location = /api/chat/messages {
        limit_req zone=per_ip burst=100 nodelay;
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Visitors must not be able to claim they are the website's own server.
        proxy_set_header X-Internal-Request "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=per_ip burst=100 nodelay;
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The API trusts one proxy (TRUST_PROXY=1) and reads the visitor's address from the last hop added here.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Request "";
        # If a process fails before answering, try another one. Only requests that are safe to repeat (GET, HEAD)
        # are retried: nginx never repeats a POST on its own, so an order cannot be placed twice by the balancer.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 60s;
    }

    # Built files have a hash in their name, so browsers may keep them for good.
    location /_next/static/ {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Only the website's server uses this port, and it is not published to the host, so nobody outside can reach it.
# The server renders some pages by calling the API; those calls come from one address on behalf of many visitors, so
# the API must not count them as one person. This port marks them (X-Internal-Request) and has no per-address limit.
server {
    listen 81;
    server_name _;

    location /api/ {
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Request 1;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 60s;
    }
}
